name: Bounded optimization completion

on:
  push:
    branches: [perf/optimization-complete-2026-11-14]
    paths:
      - .github/workflows/optimization-completion.yml
      - tool/run_optimization_completion.py
      - lib/src/geometry/solver.dart
      - test/geometry_default_manifold_test.dart
      - tool/performance_cad_tests.txt

permissions:
  contents: write

concurrency:
  group: optimization-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  completion:
    name: Pinned correctness and sequential physical comparisons
    # The observed Ubuntu queue is backed up. This is a fresh macOS cohort,
    # explicitly separate from the preserved Linux comparison rounds.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DART_SUPPRESS_ANALYTICS: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.14.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run bounded qualification and comparisons
        run: python3 tool/run_optimization_completion.py
      - name: Preserve complete and partial raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/results/2026-11-14-actions-completion/
            ${{ runner.temp }}/dart-csp-completion/*/results/
            ${{ runner.temp }}/dart-csp-completion/*/logs/
          if-no-files-found: warn
          retention-days: 90
